      <text x="368" y="126" class="mono meta" fill="#172126">SIGNAL</text>
      <text x="368" y="146" class="mono hex" fill="#516168">#B63D81</text>
      <text x="552" y="126" class="mono meta" fill="#172126">REFRACTION</text>
      <text x="552" y="146" class="mono hex" fill="#516168">#D0B24B</text>
      <text x="736" y="126" class="mono meta" fill="#172126">TRACE</text>
      <text x="736" y="146" class="mono hex" fill="#516168">#B8D4D1</text>
