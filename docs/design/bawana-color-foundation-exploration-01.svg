  <text x="70" y="1370" class="mono hex" fill="#5D6165">NEXT AFTER DIRECTION: ACCESSIBILITY PAIRS · sRGB/RGB · ICC-PROFILED CMYK · SPOT/INK REFERENCES · FABRIC PROOFS</text>
