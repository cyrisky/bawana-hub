      <rect x="184" y="0" width="172" height="102" rx="10" fill="#1D2933"/>
      <rect x="368" y="0" width="172" height="102" rx="10" fill="#B84A38"/>
      <rect x="552" y="0" width="172" height="102" rx="10" fill="#62A6AD"/>
      <rect x="736" y="0" width="172" height="102" rx="10" fill="#D59B6A"/>
      <text x="0" y="126" class="mono meta" fill="#1D2933">GROUND</text>
      <text x="0" y="146" class="mono hex" fill="#5D6165">#EEE8DF</text>
      <text x="184" y="126" class="mono meta" fill="#1D2933">INK</text>
      <text x="184" y="146" class="mono hex" fill="#5D6165">#1D2933</text>
      <text x="368" y="126" class="mono meta" fill="#1D2933">SIGNAL</text>
      <text x="368" y="146" class="mono hex" fill="#5D6165">#B84A38</text>
      <text x="552" y="126" class="mono meta" fill="#1D2933">REFRACTION</text>
      <text x="552" y="146" class="mono hex" fill="#5D6165">#62A6AD</text>
      <text x="736" y="126" class="mono meta" fill="#1D2933">EDGE</text>
      <text x="736" y="146" class="mono hex" fill="#5D6165">#D59B6A</text>
    </g>

    <g transform="translate(980 0)">
      <rect width="680" height="250" rx="20" fill="#1D2933"/>
      <path d="M470 0 H680 V250 H340 C385 212 410 180 416 140 C424 92 451 46 470 0 Z" fill="#EEE8DF"/>
      <path d="M515 0 H680 V148 C621 137 577 102 548 65 C533 45 520 22 515 0 Z" fill="url(#adv-refract)"/>
      <text x="35" y="40" class="mono meta" fill="#9EB2BA">DECISION BRIEF / 04</text>
      <text x="35" y="92" class="sans mock-title" fill="#EEE8DF">From scattered requests</text>
      <text x="35" y="124" class="sans mock-title" fill="#EEE8DF">to one operating model.</text>
      <text x="35" y="168" class="sans mock-body" fill="#BAC5CA">A practical roadmap for the next 90 days.</text>
      <rect x="35" y="196" width="126" height="34" rx="17" fill="#B84A38"/>
      <text x="55" y="218" class="mono hex" fill="#EEE8DF" font-weight="700">OPEN BRIEF</text>
      <text x="478" y="208" class="mono hex" fill="#1D2933">BAWANA / ADVISORY</text>
    </g>
