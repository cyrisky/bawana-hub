      <rect x="0" y="0" width="172" height="102" rx="10" fill="#F0E5CB"/>
      <rect x="184" y="0" width="172" height="102" rx="10" fill="#2B2433"/>
      <rect x="368" y="0" width="172" height="102" rx="10" fill="#3C7A57"/>
      <rect x="552" y="0" width="172" height="102" rx="10" fill="#7D5BC7"/>
      <rect x="736" y="0" width="172" height="102" rx="10" fill="#E3A72F"/>
