      <path d="M455 0 H680 V250 H345 C395 205 385 150 430 112 C470 78 475 40 455 0 Z" fill="#3C7A57"/>
      <path d="M520 0 H680 V168 C622 146 579 117 545 76 C525 51 516 24 520 0 Z" fill="url(#res-refract)"/>
