      <rect x="128" y="-20" width="132" height="34" rx="17" fill="#B63D81" stroke="#172126" stroke-width="2"/>
      <text x="153" y="2" class="mono hex" fill="#FFFFFF" font-weight="700">RASPBERRY ✓</text>
      <rect x="270" y="-20" width="116" height="34" rx="17" fill="#B4C448"/>
      <text x="294" y="2" class="mono hex" fill="#172126">SULFUR</text>
      <rect x="396" y="-20" width="128" height="34" rx="17" fill="#F15E45"/>
      <text x="417" y="2" class="mono hex" fill="#172126">VERMILION</text>
