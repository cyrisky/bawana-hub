<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "Courier New", monospace; }
      .title { font-size: 54px; font-weight: 500; letter-spacing: -2px; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .section { font-size: 30px; font-weight: 700; }
      .sub { font-size: 17px; }
      .meta { font-size: 13px; letter-spacing: 1px; }
      .hex { font-size: 12px; }
      .mock-title { font-size: 26px; font-weight: 700; }
      .mock-body { font-size: 14px; }
    </style>
    <linearGradient id="sys-refract" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B63D81" stop-opacity=".92"/>
      <stop offset="1" stop-color="#D0B24B" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="res-refract" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3C7A57" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7D5BC7" stop-opacity=".76"/>
    </linearGradient>
    <linearGradient id="adv-refract" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B84A38" stop-opacity=".9"/>
      <stop offset="1" stop-color="#62A6AD" stop-opacity=".72"/>
