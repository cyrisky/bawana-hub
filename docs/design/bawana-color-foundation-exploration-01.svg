  <rect width="1800" height="1400" fill="#F5F2EC"/>
  <text x="70" y="75" class="sans eyebrow" fill="#1D2024">BAWANA · UNIVERSAL COLOR FOUNDATION · EXPLORATION 02</text>
  <text x="70" y="145" class="sans title" fill="#1D2024">One grammar. Three different atmospheres.</text>
  <text x="70" y="190" class="sans sub" fill="#50545A">Quiet ground → strong signal → refracted companion. Core palettes are provisional screen values.</text>
  <line x1="70" y1="225" x2="1730" y2="225" stroke="#1D2024" stroke-width="2"/>

  <!-- SYSTEMS -->
  <g transform="translate(70 270)">
    <text x="0" y="0" class="mono eyebrow" fill="#172126">01 · TOOLS &amp; SYSTEMS</text>
    <text x="0" y="42" class="sans section" fill="#172126">Quiet Current</text>
    <text x="0" y="70" class="sans sub" fill="#4D5A60">Calm enough for daily use; raspberry creates the unexpected sharp moment.</text>

    <g transform="translate(0 100)">
      <rect x="0" y="0" width="172" height="102" rx="10" fill="#E9EEF0"/>
      <rect x="184" y="0" width="172" height="102" rx="10" fill="#172126"/>
      <rect x="368" y="0" width="172" height="102" rx="10" fill="#B63D81"/>
      <rect x="552" y="0" width="172" height="102" rx="10" fill="#D0B24B"/>
      <rect x="736" y="0" width="172" height="102" rx="10" fill="#B8D4D1"/>
