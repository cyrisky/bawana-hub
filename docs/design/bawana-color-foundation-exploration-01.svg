      <text x="0" y="146" class="mono hex" fill="#6A5B64">#F0E5CB</text>
      <text x="184" y="126" class="mono meta" fill="#2B2433">INK</text>
      <text x="184" y="146" class="mono hex" fill="#6A5B64">#2B2433</text>
      <text x="368" y="126" class="mono meta" fill="#2B2433">SIGNAL</text>
      <text x="368" y="146" class="mono hex" fill="#6A5B64">#3C7A57</text>
