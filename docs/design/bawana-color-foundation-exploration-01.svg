      <circle cx="185" cy="140" r="11" fill="#B63D81"/>
      <text x="210" y="136" class="sans mock-body" fill="#172126" font-weight="700">Map competitor onboarding</text>
      <text x="210" y="158" class="sans mock-body" fill="#5F6A70">Scout is comparing 12 flows</text>
      <rect x="525" y="120" width="86" height="32" rx="16" fill="#D0B24B"/>
      <text x="547" y="141" class="mono hex" fill="#172126" font-weight="700">ACTIVE</text>
