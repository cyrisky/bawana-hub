      <rect x="100" y="0" width="20" height="250" fill="#172126"/>
      <circle cx="60" cy="52" r="16" fill="#B8D4D1"/>
      <circle cx="60" cy="104" r="8" fill="#E9EEF0" opacity=".6"/>
      <circle cx="60" cy="144" r="8" fill="#E9EEF0" opacity=".6"/>
