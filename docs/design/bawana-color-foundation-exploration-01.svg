      <text x="35" y="84" class="sans mock-title" fill="#2B2433">When tools become</text>
      <text x="35" y="115" class="sans mock-title" fill="#2B2433">personal infrastructure</text>
      <rect x="35" y="143" width="250" height="4" fill="#E3A72F"/>
      <text x="35" y="178" class="sans mock-body" fill="#53495A">Three patterns across 28 personal AI systems.</text>
      <text x="35" y="220" class="mono hex" fill="#3C7A57">BAWANA / RESEARCH</text>
